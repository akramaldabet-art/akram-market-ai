name: Build AKRAM MARKET AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AKRAM-MARKET-AI-FULL-ANDROID-SOURCE.zip"
      - ".github/workflows/main.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q AKRAM-MARKET-AI-FULL-ANDROID-SOURCE.zip -d project
          echo "=== ZIP CONTENTS ==="
          find project -maxdepth 3 -type f | sort | head -200

      - name: Locate package.json
        id: locate
        shell: bash
        run: |
          PKG="$(find "$GITHUB_WORKSPACE/project" -name package.json -type f -not -path '*/node_modules/*' | head -1)"
          if [ -z "$PKG" ]; then
            echo "ERROR: package.json not found inside ZIP"
            exit 1
          fi

          ROOT="$(dirname "$PKG")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        working-directory: ${{ steps.locate.outputs.root }}
        run: npm test -- --run
        continue-on-error: false

      - name: Build web app
        working-directory: ${{ steps.locate.outputs.root }}
        run: npm run build

      - name: Ensure Android platform
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android debug APK
        working-directory: ${{ steps.locate.outputs.root }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        id: apk
        shell: bash
        run: |
          APK="$(find "${{ steps.locate.outputs.root }}/android/app/build/outputs/apk/debug" -name '*.apk' -type f | head -1)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/AKRAM-MARKET-AI.apk"
          ls -lh "$GITHUB_WORKSPACE/AKRAM-MARKET-AI.apk"
          sha256sum "$GITHUB_WORKSPACE/AKRAM-MARKET-AI.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AKRAM-MARKET-AI-APK
          path: AKRAM-MARKET-AI.apk
          if-no-files-found: error
          retention-days: 30
